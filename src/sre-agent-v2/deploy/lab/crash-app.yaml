apiVersion: v1
kind: Namespace
metadata:
  name: sre-agent-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-app
  namespace: sre-agent-lab
  labels:
    app: crash-app
    app.kubernetes.io/part-of: sre-agent-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-app
  template:
    metadata:
      labels:
        app: crash-app
        app.kubernetes.io/part-of: sre-agent-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: main
          image: alpine:3.20.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - echo 'intentional lab failure'; exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
