apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent-v2
  namespace: sre-agent-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-v2-observer
  namespace: sre-agent-lab
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get

  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get

  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-v2-observer
  namespace: sre-agent-lab
subjects:
  - kind: ServiceAccount
    name: sre-agent-v2
    namespace: sre-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-v2-observer

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-v2-state-writer
  namespace: sre-agent-system
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - sre-agent-v2-state
    verbs:
      - get
      - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-v2-state-writer
  namespace: sre-agent-system
subjects:
  - kind: ServiceAccount
    name: sre-agent-v2
    namespace: sre-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-v2-state-writer
