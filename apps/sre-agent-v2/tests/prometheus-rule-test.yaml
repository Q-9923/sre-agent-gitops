rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  - name: SRE Agent metrics target remains unavailable
    interval: 1m
    input_series:
      - series: 'up{namespace="sre-agent-system",service="sre-agent-v2-metrics"}'
        values: '1 0 0 0 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: SREAgentMetricsTargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: SREAgentMetricsTargetDown
        exp_alerts:
          - exp_labels:
              component: sre-agent-v2
              namespace: sre-agent-system
              service: sre-agent-v2-metrics
              severity: warning
            exp_annotations:
              summary: SRE Agent metrics target is unavailable
              description: Prometheus cannot scrape the SRE Agent metrics target in namespace sre-agent-system.
      - eval_time: 4m
        alertname: SREAgentMetricsTargetDown
        exp_alerts: []

  - name: SRE Agent metrics target disappears from discovery
    interval: 1m
    input_series:
      - series: 'up{namespace="sre-agent-system",service="sre-agent-v2-metrics"}'
        values: '1 stale _ _ 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: SREAgentMetricsTargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: SREAgentMetricsTargetDown
        exp_alerts:
          - exp_labels:
              component: sre-agent-v2
              namespace: sre-agent-system
              service: sre-agent-v2-metrics
              severity: warning
            exp_annotations:
              summary: SRE Agent metrics target is unavailable
              description: Prometheus cannot scrape the SRE Agent metrics target in namespace sre-agent-system.
      - eval_time: 4m
        alertname: SREAgentMetricsTargetDown
        exp_alerts: []

  - name: SRE Agent cycle errors remain below threshold
    interval: 1m
    input_series:
      - series: 'sre_agent_cycles_total{namespace="sre-agent-system",service="sre-agent-v2-metrics",result="ERROR"}'
        values: '0 0 0 0 0 2 2 2'
    alert_rule_test:
      - eval_time: 7m
        alertname: SREAgentCycleErrorsIncreasing
        exp_alerts: []

  - name: SRE Agent cycle errors cross threshold and recover
    interval: 1m
    input_series:
      - series: 'sre_agent_cycles_total{namespace="sre-agent-system",service="sre-agent-v2-metrics",result="ERROR"}'
        values: '0 0 0 0 0 3 3 3 3 3 3'
    alert_rule_test:
      - eval_time: 6m
        alertname: SREAgentCycleErrorsIncreasing
        exp_alerts: []
      - eval_time: 7m
        alertname: SREAgentCycleErrorsIncreasing
        exp_alerts:
          - exp_labels:
              component: sre-agent-v2
              namespace: sre-agent-system
              service: sre-agent-v2-metrics
              severity: warning
            exp_annotations:
              summary: SRE Agent cycle errors are increasing
              description: SRE Agent recorded at least three failed cycles during the last five minutes.
      - eval_time: 10m
        alertname: SREAgentCycleErrorsIncreasing
        exp_alerts: []

  - name: Permanent lab CrashLoop fires after the hold and recovers
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="sre-agent-lab",pod="crash-app-demo",container="app",reason="CrashLoopBackOff"}'
        values: '0 1 1 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: PodCrashLooping
        exp_alerts: []
      - eval_time: 2m
        alertname: PodCrashLooping
        exp_alerts:
          - exp_labels:
              namespace: sre-agent-lab
              pod: crash-app-demo
              container: app
              reason: CrashLoopBackOff
              severity: critical
            exp_annotations:
              summary: Pod is crash looping in the allowed lab namespace
              description: Pod sre-agent-lab/crash-app-demo (container app) is in CrashLoopBackOff.
      - eval_time: 3m
        alertname: PodCrashLooping
        exp_alerts: []

  - name: CrashLoops outside the allowed namespace never enter the Agent rule
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="default",pod="default-crash",container="app",reason="CrashLoopBackOff"}'
        values: '1 1 1'
      - series: 'kube_pod_container_status_waiting_reason{namespace="kube-system",pod="system-crash",container="app",reason="CrashLoopBackOff"}'
        values: '1 1 1'
      - series: 'kube_pod_container_status_waiting_reason{namespace="monitoring",pod="monitoring-crash",container="app",reason="CrashLoopBackOff"}'
        values: '1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: PodCrashLooping
        exp_alerts: []

  - name: Healthy or non CrashLoop lab containers do not fire
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="sre-agent-lab",pod="healthy-app",container="app",reason="CrashLoopBackOff"}'
        values: '0 0 0'
      - series: 'kube_pod_container_status_waiting_reason{namespace="sre-agent-lab",pod="pull-error",container="app",reason="ImagePullBackOff"}'
        values: '1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: PodCrashLooping
        exp_alerts: []
