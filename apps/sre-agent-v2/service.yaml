apiVersion: v1
kind: Service
metadata:
  name: sre-agent-v2-metrics
  namespace: sre-agent-system
  labels:
    app.kubernetes.io/name: sre-agent-v2
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sre-agent-v2
  ports:
    - name: metrics
      port: 8080
      targetPort: health
      protocol: TCP
