apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-agent-v2-shadow
  namespace: argocd
  labels:
    app.kubernetes.io/name: sre-agent-v2
    app.kubernetes.io/component: agent
    app.kubernetes.io/environment: shadow
spec:
  project: default

  source:
    repoURL: https://github.com/Q-9923/sre-agent-gitops.git
    targetRevision: main
    path: apps/sre-agent-v2

  destination:
    server: https://kubernetes.default.svc
    namespace: sre-agent-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
