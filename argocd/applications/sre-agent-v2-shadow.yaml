apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-agent-v2-shadow
  namespace: argocd
  labels:
    app.kubernetes.io/name: sre-agent-v2
    app.kubernetes.io/component: agent
    app.kubernetes.io/environment: shadow
spec:
  project: default

  source:
    repoURL: https://github.com/Q-9923/sre-agent-gitops.git
    # 发布时将该模板固定到已审查且远端可读取的完整提交 SHA。
    targetRevision: main
    path: apps/sre-agent-v2
    # 恢复阶段仅接管观测对象，不覆盖缓存应急 Deployment 或运行态 ConfigMap。
    directory:
      recurse: false
      include: '{prometheusrule.yaml,grafana-dashboard.yaml,service.yaml,servicemonitor.yaml}'

  destination:
    server: https://kubernetes.default.svc
    namespace: sre-agent-system

  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
